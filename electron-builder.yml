appId: com.kunoir.addled
productName: Addled
copyright: Copyright © 2026 Kunoir

directories:
  output: dist
  buildResources: electron/icons

files:
  - electron/**/*
  - bots/**/*.js
  - bots/**/*.json
  - package.json
  - '!**/__pycache__/**'
  - '!**/*.pyc'
  - '!**/.git'

# The bot bridges are Node scripts launched by an external `node`, which cannot
# read inside app.asar. Unpack them and the packed dependencies they resolve
# through (the bots pull transitive packages, so listing them individually is
# not enough). Dev-only packages such as electron and app-builder-bin are not
# packed in the first place.
asarUnpack:
  - bots/**
  - node_modules/**

extraResources:
  # `backend/` is half code and half the running instance's own state, and
  # `filter: ['**/*']` shipped both — which is how the 1.0.17 installer came to
  # contain a live API key, the remote password hash, the developer's chat
  # history and their memory databases. `.gitignore` had been excluding all of
  # it from git, so nothing in a review of the repository showed it; the
  # packaging step does not read `.gitignore`, and nothing compared the two.
  #
  # The patterns below mirror `.gitignore` deliberately. `scripts/check_packaging.py`
  # fails if the two ever drift, so a new kind of data file cannot start
  # shipping just because it was added to one list and not the other. That is
  # what makes this list safe to keep: `.gitignore` ignores everything under
  # `backend/memory/` except the code, so any file that appears there must be
  # excluded here too, and the check says so by name when it is not.
  #
  # A blanket `!memory/**` is not possible: electron-builder's filter only
  # subtracts, and the memory modules are .py files in the same directory.
  - from: backend
    to: backend
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      # The instance's own memory, profile, config, logs and audit trail.
      - '!memory/*.json'
      - '!memory/*.db'
      - '!memory/*.db-shm'
      - '!memory/*.db-wal'
      - '!memory/*.log'
      - '!memory/*.jsonl'
      - '!memory/.vault*'
      # Fetched or downloaded per machine, and re-downloaded on demand.
      - '!memory/guidelines/**'
      - '!memory/models/**'
      - '!memory/skins/**'
      # Learned on this machine, so they differ per user.
      - '!memory/wiki/**'
      - '!memory/journal/**'
      - '!memory/sop/**'
      - '!memory/goals/**'
      - '!memory/market_skills/**'
      - '!memory/forged_skills/**'
      - '!memory/snapshots/**'
      - '!memory/projects/**'
      - '!memory/conversations/**'
      - '!memory/logs/**'
      # The swarm roster is the user's own desks: their names, briefs, learned
      # corrections and pinned models. It is written on first run and edited by
      # hand, so shipping the developer's copy would replace a user's team with
      # someone else's on every upgrade — the same fault the calendar entry
      # below records, and the reason check_packaging.py fails by name when a
      # new memory folder is not listed here.
      - '!memory/swarm/**'
      # Integrations are per machine, including `calendar_events.json`. It looks
      # like a seed because it is an empty list, but it is the user's calendar:
      # shipping it meant an upgrade replaced it with an empty one. The calendar
      # treats an absent file as an empty list, so it does not need to ship.
      - '!memory/integrations/**'
      # NOT excluded: `backend/voice/models/**`. Those 339 MB are fetched once
      # by scripts/fetch_voice_models.py and bundled on purpose, because the
      # offline voice needs them present.
  #
  # There was a `tools/rtk` entry here, copying 13 MB of rtk.exe and rg.exe.
  # `tools/` is ignored by git, so those binaries were never in the repository:
  # they were fetched by hand on one machine and then copied into every build.
  # Two things followed — a fresh clone could not produce the same installer,
  # and the release carried binaries that no review could see. The app installs
  # them itself now, from Settings → Tools, into this machine
  # (backend/tools/rtk.py). `check_packaging.py` refuses a gitignored source
  # that is not declared below, so re-adding this entry means saying why.
  - from: dashboard/out
    to: dashboard
    filter: ['**/*']
  - from: electron/icons
    to: icons
    filter: ['**/*']
  - from: launch.bat
    to: launch.bat
  - from: requirements.txt
    to: requirements.txt
  - from: python-bundle
    to: python
    filter: ['**/*']

win:
  # A multi-size .ico rather than one bitmap: Windows picks 16/32/48 for the
  # taskbar, Start Menu and Explorer, and a single large PNG scaled down to 16px
  # comes out soft.
  icon: electron/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: '${productName}-${version}-${arch}.${ext}'
  sign: null
  # This has to stay true for the icon to reach the executable at all. The Start
  # Menu and desktop shortcuts point at Addled.exe with icon index 0, so while
  # this was false electron-builder skipped stamping the exe and every shortcut
  # showed Electron's default atom instead of Addled's own icon.
  #
  # It needs rcedit, which ships inside electron-builder's `winCodeSign` bundle.
  # That bundle contains macOS symlinks, and Windows refuses to create symlinks
  # without elevation, so the extraction fails with "A required privilege is not
  # held by the client" and the build stops. Turning Windows Developer Mode on
  # (Settings > Privacy & security > For developers) fixes it properly; the
  # alternative is to seed the cache once by hand, copying the extracted
  # rcedit-x64.exe into
  #   %LOCALAPPDATA%\electron-builder\Cache\winCodeSign\winCodeSign-2.6.0\
  # The rest of the archive extracts fine - only those two .dylib links fail,
  # and they are of no use on Windows anyway.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Addled
  uninstallDisplayName: Addled
  installerIcon: electron/icons/icon.ico
  uninstallerIcon: electron/icons/icon.ico

portable:
  artifactName: '${productName}-${version}-portable.${ext}'

publish:
  provider: github
  owner: 8kunoir8
  repo: Addled
  releaseType: release
