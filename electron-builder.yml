appId: com.kunoir.addled
productName: Addled
copyright: Copyright © 2026 Kunoir

directories:
  output: dist
  buildResources: electron/icons

files:
  - electron/**/*
  - bots/**/*.js
  - bots/**/*.json
  - package.json
  - '!**/__pycache__/**'
  - '!**/*.pyc'
  - '!**/.git'

extraResources:
  - from: backend
    to: backend
    filter: ['**/*']
  - from: dashboard/out
    to: dashboard
    filter: ['**/*']
  - from: electron/icons
    to: icons
    filter: ['**/*']
  - from: launch.bat
    to: launch.bat
  - from: requirements.txt
    to: requirements.txt

win:
  icon: electron/icons/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: '${productName}-${version}-${arch}.${ext}'
  sign: null
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Addled
  uninstallDisplayName: Addled

portable:
  artifactName: '${productName}-${version}-portable.${ext}'

publish:
  provider: github
  owner: 8kunoir8
  repo: Addled
  releaseType: release
