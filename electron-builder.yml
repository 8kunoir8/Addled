appId: com.kunoir.addled
productName: Addled
copyright: Copyright © 2026 Kunoir

# Top-level, not under `nsis`: in electron-builder 24.x this is the property
# that controls the installer's LZMA level (`maximum` | `normal` | `store`),
# and `nsis` does not accept it — putting it there fails schema validation.
# The payload is ~880 MB, 825 MB of it the bundled Python and its
# site-packages -- mostly already-compressed wheels -- so the default `normal`
# leaves size on the table for build time we are not short of. Nothing at
# runtime changes.
compression: maximum

directories:
  output: dist
  buildResources: electron/icons

files:
  - electron/**/*
  - bots/**/*.js
  - bots/**/*.json
  - package.json
  - '!**/__pycache__/**'
  - '!**/*.pyc'
  - '!**/.git'

# The bot bridges are Node scripts launched by an external `node`, which cannot
# read inside app.asar. Unpack them and the packed dependencies they resolve
# through (the bots pull transitive packages, so listing them individually is
# not enough). Dev-only packages such as electron and app-builder-bin are not
# packed in the first place.
asarUnpack:
  - bots/**
  - node_modules/**

extraResources:
  # `backend/` is half code and half the running instance's own state, and
  # `filter: ['**/*']` shipped both — which is how the 1.0.17 installer came to
  # contain a live API key, the remote password hash, the developer's chat
  # history and their memory databases. `.gitignore` had been excluding all of
  # it from git, so nothing in a review of the repository showed it; the
  # packaging step does not read `.gitignore`, and nothing compared the two.
  #
  # The patterns below mirror `.gitignore` deliberately. `scripts/check_packaging.py`
  # fails if the two ever drift, so a new kind of data file cannot start
  # shipping just because it was added to one list and not the other. That is
  # what makes this list safe to keep: `.gitignore` ignores everything under
  # `backend/memory/` except the code, so any file that appears there must be
  # excluded here too, and the check says so by name when it is not.
  #
  # A blanket `!memory/**` is not possible: electron-builder's filter only
  # subtracts, and the memory modules are .py files in the same directory.
  - from: backend
    to: backend
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      # The instance's own memory, profile, config, logs and audit trail.
      - '!memory/*.json'
      # The settings save writes a temp file then renames it, and keeps a .bak
      # of what it replaced. `!memory/*.json` does not match either — the `*`
      # does not cross the extra extension — so without these two lines the
      # installer would ship a developer's backup and an upgrade would restore
      # it over the user's live settings.
      - '!memory/*.json.tmp'
      - '!memory/*.json.bak'
      - '!memory/*.db'
      - '!memory/*.db-shm'
      - '!memory/*.db-wal'
      - '!memory/*.log'
      - '!memory/*.jsonl'
      - '!memory/.vault*'
      # Fetched or downloaded per machine, and re-downloaded on demand.
      - '!memory/guidelines/**'
      - '!memory/models/**'
      - '!memory/skins/**'
      # Learned on this machine, so they differ per user.
      - '!memory/wiki/**'
      - '!memory/journal/**'
      - '!memory/sop/**'
      - '!memory/goals/**'
      - '!memory/market_skills/**'
      - '!memory/forged_skills/**'
      - '!memory/snapshots/**'
      - '!memory/projects/**'
      - '!memory/conversations/**'
      - '!memory/logs/**'
      # The browser's own state: Chromium's cache, cookies, local storage and
      # the ~150 MB of browser binaries. Both live under the data directory,
      # which on a real install is beside `backend/` — but a source checkout
      # resolves the data directory into `backend/memory/`, so without these
      # two lines a developer's profile (cookies, extension state, crash
      # dumps) shipped inside the installer. `check_packaging.py` found it.
      - '!memory/browser_profile/**'
      - '!memory/ms-playwright/**'
      # The swarm roster is the user's own desks: their names, briefs, learned
      # corrections and pinned models. It is written on first run and edited by
      # hand, so shipping the developer's copy would replace a user's team with
      # someone else's on every upgrade — the same fault the calendar entry
      # below records, and the reason check_packaging.py fails by name when a
      # new memory folder is not listed here.
      - '!memory/swarm/**'
      # Integrations are per machine, including `calendar_events.json`. It looks
      # like a seed because it is an empty list, but it is the user's calendar:
      # shipping it meant an upgrade replaced it with an empty one. The calendar
      # treats an absent file as an empty list, so it does not need to ship.
      - '!memory/integrations/**'
      # The Kokoro voice models: 354 MB, and most of why the installer was
      # 589 MB. They are downloaded on request from Settings -> Voice
      # (backend/voice/model_install.py) into the data directory, which is the
      # only place they *can* go -- the install is read-only. The silero VAD
      # model stays bundled: it is 2.3 MB and the speech listener needs it
      # before any download could have happened, so an install with no
      # download still has a working listener.
      - '!voice/models/kokoro-v1.0.onnx'
      - '!voice/models/voices-v1.0.bin'
      # NOT excluded: `backend/voice/models/silero_vad.onnx`, for the reason
      # above, and the SenseVoice STT model, which was already unbundled and
      # is fetched by scripts/fetch_voice_models.py -- Kokoro was the odd one
      # out in still being shipped.
  #
  # There was a `tools/rtk` entry here, copying 13 MB of rtk.exe and rg.exe.
  # `tools/` is ignored by git, so those binaries were never in the repository:
  # they were fetched by hand on one machine and then copied into every build.
  # Two things followed — a fresh clone could not produce the same installer,
  # and the release carried binaries that no review could see. The app installs
  # them itself now, from Settings → Tools, into this machine
  # (backend/tools/rtk.py). `check_packaging.py` refuses a gitignored source
  # that is not declared below, so re-adding this entry means saying why.
  - from: dashboard/out
    to: dashboard
    filter: ['**/*']
  - from: electron/icons
    to: icons
    filter: ['**/*']
  - from: launch.bat
    to: launch.bat
  - from: requirements.txt
    to: requirements.txt
  # Shipped so the "Install vision support" button can install a declared set
  # rather than a hardcoded list that drifts from the repository. The bundled
  # interpreter excludes this block on purpose (~400 MB of torch), so the file
  # arriving without its packages installed is the intended state — the button
  # reads it and installs on demand.
  - from: requirements-vision.txt
    to: requirements-vision.txt
  # Called once by the installer (see nsis.include / build/installer-precompile.nsh)
  # to put back the bytecode cache the python-bundle filter strips. It is a
  # standalone script with no imports of its own beyond the stdlib, so it runs
  # under the bundled interpreter before the app has ever started.
  - from: scripts/precompile_bundle.py
    to: scripts/precompile_bundle.py
  # Called by the installer if the "download the offline voice" box is ticked
  # (see electron/installer-precompile.nsh), and by hand from a terminal. It
  # imports the app's own backend.voice.model_install, so the pin and the
  # digest check are the same ones the Settings button uses -- one
  # implementation, not a second in NSIS that could check less.
  - from: scripts/fetch_kokoro.py
    to: scripts/fetch_kokoro.py
  # The embedded interpreter. It ships WITHOUT its bytecode cache, and the
  # installer pre-compiles it once on the user's machine instead (see the
  # post-install step below and scripts/precompile_bundle.py).
  #
  # `__pycache__` was 654 MB of the 938 MB bundle, and it is a CACHE: Python
  # regenerates every .pyc from the .py beside it on first import. It shipped
  # anyway because this entry's filter was a bare `['**/*']` — the two
  # `!**/__pycache__/**` lines already in this file cover the `backend/` block
  # and the asar, and neither is this one. The install target is
  # C:\Program Files, where the app CANNOT write after install, so stripping
  # the cache without compiling it back would make every launch recompile
  # numpy and PyQt6 from source. That is the whole reason the pre-compile step
  # exists: pay the compile once, at install, where an elevated writer can.
  #
  # `*.dist-info` is NOT excluded, and that is a fix rather than an oversight.
  #
  # It was excluded on the reasoning that it is "package metadata only (pip
  # show reads it; the app does not)". The second half was wrong. `rdflib`'s
  # `__init__.py` calls `metadata.metadata("rdflib")` at import, unguarded, so
  # without its dist-info the import raises PackageNotFoundError -- and rdflib
  # is not imported for RDF here: the offline voice reaches it through
  # kokoro_onnx, phonemizer, segments and csvw. So every installed copy failed
  # Kokoro with "No package metadata was found for rdflib" and fell back to
  # Edge, while a source checkout, which has the metadata, worked. Nothing
  # caught it because nothing ran a built installer.
  #
  # Measured before deciding: all 116 dist-info directories are 4.5 MB
  # together, on an installer that was 589 MB and is now about 258 MB. The
  # exclusion saved nothing worth having and broke a feature, so it is gone
  # rather than narrowed to rdflib -- nine other packages read their own
  # metadata too, and re-including them one failure at a time is how the next
  # one ships. `pythonwin` stays excluded: it is 20 MB of Tk IDE that nothing
  # imports, which is a real saving rather than an assumed one.
  - from: python-bundle
    to: python
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!**/*.pyo'
      - '!**/tests/**'
      - '!**/test/**'
      - '!**/pythonwin/**'
      - '!**/Lib/test/**'

win:
  # A multi-size .ico rather than one bitmap: Windows picks 16/32/48 for the
  # taskbar, Start Menu and Explorer, and a single large PNG scaled down to 16px
  # comes out soft.
  icon: electron/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: '${productName}-${version}-${arch}.${ext}'
  sign: null
  # This has to stay true for the icon to reach the executable at all. The Start
  # Menu and desktop shortcuts point at Addled.exe with icon index 0, so while
  # this was false electron-builder skipped stamping the exe and every shortcut
  # showed Electron's default atom instead of Addled's own icon.
  #
  # It needs rcedit, which ships inside electron-builder's `winCodeSign` bundle.
  # That bundle contains macOS symlinks, and Windows refuses to create symlinks
  # without elevation, so the extraction fails with "A required privilege is not
  # held by the client" and the build stops. Turning Windows Developer Mode on
  # (Settings > Privacy & security > For developers) fixes it properly; the
  # alternative is to seed the cache once by hand, copying the extracted
  # rcedit-x64.exe into
  #   %LOCALAPPDATA%\electron-builder\Cache\winCodeSign\winCodeSign-2.6.0\
  # The rest of the archive extracts fine - only those two .dylib links fail,
  # and they are of no use on Windows anyway.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Addled
  uninstallDisplayName: Addled
  installerIcon: electron/icons/icon.ico
  uninstallerIcon: electron/icons/icon.ico
  # The interpreter ships without `__pycache__` (see the python-bundle filter
  # above), so compile it once here, where the installer runs elevated and can
  # write into the install directory. Without this the app would recompile
  # numpy and PyQt6 on every launch from C:\Program Files, which it cannot
  # write to. Best-effort: a failure here must not fail the install, because
  # the app still runs — just with a slower first import.
  # Kept under electron/ (which is tracked) rather than build/ (which is
  # gitignored): an include in an ignored directory would not be in the
  # repository, so a fresh clone could not rebuild the same installer — the
  # exact class of drift check_packaging.py exists to catch.
  include: electron/installer-precompile.nsh

portable:
  artifactName: '${productName}-${version}-portable.${ext}'

publish:
  provider: github
  owner: 8kunoir8
  repo: Addled
  releaseType: release
